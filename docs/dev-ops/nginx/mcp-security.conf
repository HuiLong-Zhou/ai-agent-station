# Example Nginx configuration for an MCP gateway.
# It requires the http_auth_request_module.

limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=20r/s;

upstream huilian_mcp_gateway {
    server 127.0.0.1:18080;
    keepalive 32;
}

upstream huilian_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name mcp.example.com;

    ssl_certificate     /etc/nginx/certs/mcp.crt;
    ssl_certificate_key /etc/nginx/certs/mcp.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /_mcp_auth {
        internal;
        proxy_pass http://huilian_app/internal/mcp/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-MCP-Id $http_x_mcp_id;
    }

    location /mcp/ {
        auth_request /_mcp_auth;
        limit_req zone=mcp_limit burst=20 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-MCP-Id $http_x_mcp_id;
        proxy_set_header Host $host;

        # MCP SSE must not be buffered by the reverse proxy.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass http://huilian_mcp_gateway/;
    }
}
